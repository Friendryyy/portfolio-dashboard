name: Portfolio Investment Alerts (LINE + Gemini)

on:
  schedule:
    # 1. Daily Pre-Market News Update at 20:00 BKK (13:00 UTC) Mon-Fri
    - cron: '0 13 * * 1-5'
    # 2. Weekend Portfolio Health Check on Saturday at 08:00 BKK (01:00 UTC)
    - cron: '0 1 * * 6'
    # 3. Big Catalyst: SoFi Keynote (Sep 8 at 22:00 BKK / 15:00 UTC)
    - cron: '0 15 8 9 *'
    # 4. Big Catalyst: Oracle Q1 FY27 Earnings (Sep 10 at 20:30 UTC / Sep 11 03:30 BKK)
    - cron: '30 20 10 9 *'
    # 5. Big Catalyst: US August CPI Inflation (Sep 11 at 19:35 BKK / 12:35 UTC)
    - cron: '35 12 11 9 *'
  workflow_dispatch:
    inputs:
      command:
        description: 'เลือกคำสั่งวิเคราะห์พอร์ตที่ต้องการส่งเข้า LINE'
        required: true
        default: 'portfolio-news-update'
        type: choice
        options:
          - 'portfolio-news-update'
          - 'portfolio-analysis'
          - 'dca-queue'
          - 'market-pulse'
          - 'macro-geopolitical'

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Determine Command Trigger
        id: cmd-selector
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CMD_KEYWORD=${{ github.event.inputs.command }}" >> $GITHUB_ENV
          else
            # Determine based on current UTC day of week and date
            UTC_DOW=$(date -u +%u) # 1=Mon, 6=Sat
            UTC_HOUR=$(date -u +%H)
            UTC_DAY=$(date -u +%d)

            if [ "$UTC_DOW" = "6" ]; then
              echo "CMD_KEYWORD=portfolio-analysis" >> $GITHUB_ENV
            elif [ "$UTC_DAY" = "11" ] && [ "$UTC_HOUR" = "12" ]; then
              echo "CMD_KEYWORD=market-pulse" >> $GITHUB_ENV
            else
              echo "CMD_KEYWORD=portfolio-news-update" >> $GITHUB_ENV
            fi
          fi

      - name: Run Cloud Investment Bot & Push to LINE
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python tools/cloud_news_bot.py --command $CMD_KEYWORD
